name: Build JAR
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Obtener gradle wrapper del Forge MDK 1.7.10
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-src.zip
          unzip -q mdk.zip -d mdk
          cp mdk/gradlew . && cp -r mdk/gradle .
          chmod +x gradlew
      - name: Descargar Minecraft 1.7.10 desde Mojang (las URLs viejas ya no existen)
        run: |
          C=$HOME/.gradle/caches/minecraft/net/minecraft
          mkdir -p $C/minecraft/1.7.10 $C/minecraft_server/1.7.10
          curl -fL -o $C/minecraft/1.7.10/minecraft-1.7.10.jar https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar
          curl -fL -o $C/minecraft_server/1.7.10/minecraft_server-1.7.10.jar https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar
          ls -l $C/minecraft/1.7.10 $C/minecraft_server/1.7.10
      - name: Compilar
        run: ./gradlew setupCIWorkspace build -x downloadClient -x downloadServer --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DBC-Galacticraft-SpaceFlight-JAR
          path: build/libs/*.jar
