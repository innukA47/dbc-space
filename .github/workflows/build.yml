name: Build JAR
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Obtener gradle wrapper del Forge MDK 1.7.10
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-src.zip
          unzip -q mdk.zip -d mdk
          cp mdk/gradlew . && cp -r mdk/gradle .
          chmod +x gradlew
      - name: Compilar
        run: ./gradlew setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DBC-Galacticraft-SpaceFlight-JAR
          path: build/libs/*.jar
